# Issue #103: disposable, no-secret, exact-HEAD integration verification.
# Exact integration branch only. No models, live GitHub reads, product writes or deploy.
name: ZC08D project integration QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'src/v1/**'
      - 'src/prototype/**'
      - 'server/githubDevelopmentHistory.mjs'
      - 'server/githubRoutes.mjs'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/zc08d-project-integration-qa.yml'

permissions:
  contents: read

concurrency:
  group: zc08d-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integration-checks:
    if: >-
      github.repository == 'augusliang23-web/Micro-SaaS-Command-Center' &&
      github.event.pull_request.head.repo.full_name == 'augusliang23-web/Micro-SaaS-Command-Center' &&
      github.head_ref == 'codex/zc08d-project-integration' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout exact PR HEAD without retaining GitHub credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use Node 22 (no dependency cache)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Exact HEAD and npm environment preflight
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test ! -e .npmrc || { echo 'HOLD_PROJECT_NPMRC'; exit 2; }
          if compgen -e | grep -Eiq '^(npm_config_|NPM_TOKEN$|NODE_AUTH_TOKEN$|NPM_AUTH_TOKEN$)'; then
            echo 'HOLD_UNTRUSTED_NPM_ENV_NAME'; exit 2
          fi
          node --check src/v1/liveMonitorModel.mjs
          node --check test/zc08-live-monitor.test.mjs
      - name: No-install offline Node monitor unit tests
        run: node --test --test-reporter=spec test/zc08-live-monitor.test.mjs test/zc08b-status-model.test.mjs
      - name: Install only locked npm packages in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          # npm 10 rejects user/global config pointing to the same file.
          # Create two distinct, empty config files in GitHub runner temp only.
          : > "$RUNNER_TEMP/zc08d-user.npmrc"
          : > "$RUNNER_TEMP/zc08d-global.npmrc"
          chmod 600 "$RUNNER_TEMP/zc08d-user.npmrc" "$RUNNER_TEMP/zc08d-global.npmrc"
          npm ci --userconfig="$RUNNER_TEMP/zc08d-user.npmrc" --globalconfig="$RUNNER_TEMP/zc08d-global.npmrc" --ignore-scripts --no-audit --no-fund
      - name: TypeScript type-check (no emission)
        run: npm run lint
      - name: Vite and server bundle build (no deploy)
        run: npm run build
      - name: Existing deterministic frontend regression tests
        run: npm run test:ui
      - name: Bounded source, status and V1 security regression (fake GitHub only)
        run: node --test test/github-development-history.test.mjs test/zc08-live-monitor.test.mjs test/zc08b-status-model.test.mjs test/zc08d-project-integration.test.mjs test/v1-backend-boundary.test.mjs test/github-pull-status.test.mjs test/github-repos.test.mjs test/status-provenance.test.mjs
