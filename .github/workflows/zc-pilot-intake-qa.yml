name: ZC Pilot intake QA
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: ['tools/zc-pilot/**', 'test/zc-pilot.test.mjs', 'test/zc-native-worker.test.mjs', '.github/workflows/zc-pilot-intake-qa.yml']
permissions:
  contents: read
concurrency:
  group: zc-pilot-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  offline-intake:
    if: >-
      github.repository == 'augusliang23-web/Micro-SaaS-Command-Center' &&
      github.event.pull_request.head.repo.full_name == 'augusliang23-web/Micro-SaaS-Command-Center' &&
      github.head_ref == 'codex/zc-pilot-github-intake' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Exact HEAD, syntax and offline tests only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          for file in tools/zc-pilot/*.mjs; do node --check "$file"; done
          git diff --check
          node --test test/zc-pilot.test.mjs test/zc-native-worker.test.mjs test/status-provenance.test.mjs
